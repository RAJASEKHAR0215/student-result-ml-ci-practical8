name: Student Result ML GHCR Publish

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-publish-ghcr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Train student result model
        run: python train_model.py

      - name: Check ML quality gate
        run: python quality_gate.py

      - name: Run automated tests
        run: python -m unittest discover -v

      - name: Build Docker image
        run: docker build -t student-result-prediction:latest .

      - name: Authenticate Docker to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Tag Docker image
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/student-result-prediction"
          docker tag student-result-prediction:latest "$IMAGE:v1"
          docker tag student-result-prediction:latest "$IMAGE:latest"
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Push Docker images to GHCR
        run: |
          docker push "$IMAGE:v1"
          docker push "$IMAGE:latest"

      - name: Pull image from GHCR
        run: docker pull "$IMAGE:v1"

      - name: Run container
        run: |
          docker run -d --name student-result-container -p 5000:5000 "$IMAGE:v1"

      - name: Test container health
        run: |
          for i in {1..15}; do
            if curl --fail --silent http://localhost:5000/health; then
              echo "Application is ready."
              exit 0
            fi
            sleep 2
          done
          docker logs student-result-container
          exit 1

      - name: Test prediction endpoint
        run: |
          curl --fail --silent --show-error             -X POST             -H "Content-Type: application/json"             -d '{"attendance":90,"internal_marks":85,"assignment_marks":88,"previous_score":80}'             http://localhost:5000/predict

      - name: Clean up container
        if: always()
        run: |
          docker rm -f student-result-container || true
          docker logout ghcr.io || true
